spring:
  config.import: optional:file:.env[.properties]
  application.name: uml-architect-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/uml_architect}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
server.port: ${SERVER_PORT:8080}
app.cors.allowed-origin: ${CORS_ALLOWED_ORIGIN:${FRONTEND_URL:http://localhost:3000}}
